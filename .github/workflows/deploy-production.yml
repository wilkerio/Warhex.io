name: Deploy Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ vars.APP_DIR }}
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
      DEPLOY_DISCORD_BOT: ${{ vars.DEPLOY_DISCORD_BOT }}
      SSH_HOST: ${{ secrets.DO_HOST }}
      SSH_PORT: ${{ secrets.DO_SSH_PORT }}
      SSH_USER: ${{ secrets.DO_USER }}
      SYSTEMD_SERVICES: ${{ vars.SYSTEMD_SERVICES }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            auth-server/package-lock.json
            loadbalancer/package-lock.json
            discord-bot/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Verify client build
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Verify auth-server dependencies
        working-directory: auth-server
        run: npm ci --omit=dev

      - name: Verify load balancer dependencies
        working-directory: loadbalancer
        run: npm ci --omit=dev

      - name: Verify Discord bot dependencies
        if: env.DEPLOY_DISCORD_BOT == 'true'
        working-directory: discord-bot
        run: npm ci --omit=dev

      - name: Verify Go server build
        working-directory: server
        run: |
          mkdir -p bin
          go build -o ./bin/game-server ./main

      - name: Configure SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Trust Droplet host key
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Verify SSH connectivity
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -p "$PORT" \
            "${SSH_USER}@${SSH_HOST}" "echo connected"

      - name: Upload deploy script
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          scp -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -P "$PORT" \
            scripts/deploy.sh "${SSH_USER}@${SSH_HOST}:/tmp/infinity-deploy.sh"

      - name: Run remote deployment
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" "${SSH_USER}@${SSH_HOST}" \
            "chmod +x /tmp/infinity-deploy.sh && \
            APP_DIR='${APP_DIR:-/opt/infinity.io}' \
            DEPLOY_BRANCH='${DEPLOY_BRANCH:-main}' \
            DEPLOY_DISCORD_BOT='${DEPLOY_DISCORD_BOT:-false}' \
            SYSTEMD_SERVICES='${SYSTEMD_SERVICES}' \
            /tmp/infinity-deploy.sh"
